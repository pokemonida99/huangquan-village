<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16142b">
<title>三途川物語</title>
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="三途川物語">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=20261025f">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <header id="topbar">
    <div class="hud-row">
      <button class="chip date" id="tb-date" title="點一下切換速度"><b id="tb-y">1</b><small>年</small><b id="tb-m">1</b><small>月</small><b id="tb-w">1</b><small>週</small><span id="weekbar"><i></i></span></button>
      <div class="chip money" id="tb-money" title="冥紙"><i class="ic coin"></i><b>0</b></div>
    </div>
    <div class="hud-row r2">
      <button class="chip speed" id="tb-speed" title="速度">▶</button>
      <div class="chip" id="tb-merit" title="功德"><i class="ic lotus"></i><b>0</b></div>
      <div class="chip" id="tb-helped" title="已幫助"><i class="ic heart"></i><b>0</b><small>人</small></div>
    </div>
  </header>

  <div id="goal" hidden></div>
  <div id="ribbon"></div>
  <div id="notices"></div>
  <button id="gauge" data-panel="info" title="街區評價與位階">
    <span class="g-title">評價</span><span id="g-stars"></span>
    <span id="g-rank"></span><span class="bar"><i id="g-bar"></i></span>
  </button>

  <div id="placebar" hidden>
    <span id="place-label"></span>
    <button id="place-ok">建造</button>
    <button id="place-cancel">取消</button>
  </div>

  <nav id="menu" hidden>
    <button data-panel="residents"><img src="art/chars/yutong-face.png" alt=""><span>居民</span></button>
    <button data-panel="patrol"><img src="art/chars/dabao-face.png" alt=""><span>巡守</span></button>
    <button data-panel="items"><i class="ic lantern"></i><span>道具</span></button>
    <button data-panel="info"><img src="art/chars/guanyin-face.png" alt=""><span>情報</span></button>
    <button data-panel="settings"><i class="ic gear"></i><span>設定</span></button>
  </nav>

  <div id="expstrip" hidden>
    <canvas></canvas>
    <div class="es-head"><b id="es-name"></b><span id="es-left"></span></div>
    <div class="es-bar"><i id="es-bar"></i></div>
  </div>

  <nav id="bottombar">
    <button data-panel="build" class="bb big"><i class="ic house"></i><span>建設</span></button>
    <button data-panel="requests" class="bb mid" id="reqbtn"><i class="ic scroll"></i><span>委託簿</span><em hidden>!</em></button>
    <button id="bb-menu" class="bb big"><i class="ic menu"></i><span>選單</span></button>
  </nav>

  <section id="sheet" hidden>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close">返回</button></div>
    <div id="sheet-body"></div>
  </section>

  <div id="dialog" hidden>
    <div class="dlg-title" id="dlg-title" hidden></div>
    <div class="dlg-box">
      <div class="dlg-face" id="dlg-face"></div>
      <div class="dlg-text"><div class="dlg-name" id="dlg-name"></div><div id="dlg-line"></div><div class="dlg-ep" id="dlg-ep"></div></div>
      <div class="dlg-next">▼</div>
    </div>
  </div>

  <div id="modal" hidden></div>

  <section id="title" hidden>
    <div class="title-art"></div>
    <div class="title-logo">
      <div class="tl-sub">黃泉燒肉店</div>
      <h1>三途川物語</h1>
    </div>
    <button id="title-tap"><span>點一下開始</span></button>
    <div id="title-slots" hidden></div>
    <p class="title-credit">非官方粉絲作品　角色與故事出自 IG 劇《黃泉燒肉店》</p>
  </section>
</div>

<!-- 內建範例資料（data/*.js 缺的時候補位） -->
<script src="src/sample-data.js?v=20261025f"></script>
<!-- 引擎 -->
<script src="src/util.js?v=20261025f"></script>
<script src="src/iso.js?v=20261025f"></script>
<script src="src/icons.js?v=20261025f"></script>
<script src="src/sfx.js?v=20261025f"></script>
<script src="src/data.js?v=20261025f"></script>
<script src="src/assets.js?v=20261025f"></script>
<script src="src/map.js?v=20261025f"></script>
<script src="src/state.js?v=20261025f"></script>
<script src="src/entities.js?v=20261025f"></script>
<script src="src/sim.js?v=20261025f"></script>
<script src="src/story.js?v=20261025f"></script>
<script src="src/battle.js?v=20261025f"></script>
<script src="src/expstrip.js?v=20261025f"></script>
<script src="src/render.js?v=20261025f"></script>
<script src="src/input.js?v=20261025f"></script>
<script src="src/ui.js?v=20261025f"></script>
<script src="src/title.js?v=20261025f"></script>
<script src="src/main.js?v=20261025f"></script>
<!-- 最後：依序載入 data/*.js（有就用、沒有就跳過），然後開機 -->
<script src="src/boot.js?v=20261025f"></script>
</body>
</html>
